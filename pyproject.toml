[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dummym"
version = "0.1.0"
description = "From-scratch Llama-like language model pretraining project"
requires-python = ">=3.10"
dependencies = [
    "tensorboard>=2.16",
    "tokenizers>=0.21,<1",
    "torch>=2.2",
]

[project.scripts]
dummym-download = "dummym.data.acquisition:main"
dummym-clean = "dummym.data.corpus:main"
dummym-tokenizer = "dummym.tokenizer.train:main"
dummym-pack = "dummym.data.packing:main"
dummym-pretrain = "dummym.training.cli:main"
dummym-export = "dummym.checkpoint.huggingface:main"
dummym-sft = "dummym.posttrain.sft:main"
dummym-chat = "dummym.inference.chat:main"
dummym-evaluate = "dummym.evaluation.chat:main"
dummym-publish = "dummym.checkpoint.modelscope:main"

[project.optional-dependencies]
train = [
    "numpy>=1.24",
    "PyYAML>=6",
]
data = [
    "numpy>=1.24",
    "pyarrow>=14",
]
dev = [
    "pytest>=8",
    "ruff==0.12.12",
]
workflow = [
    "matplotlib==3.10.7",
    "huggingface-hub>=0.34,<1",
    "transformers==4.57.1",
    "trl==0.24.0",
    "datasets>=3,<5",
    "safetensors>=0.5",
    "accelerate>=1.4,<2",
    "datasketch>=1.6,<2",
    "modelscope-hub==0.1.2",
]
eval = ["lm_eval==0.4.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 旧测试先 importorskip 可选依赖，再导入受测模块；这是有意的顺序。
"tests/unit/data/test_prepare_fineweb.py" = ["E402"]
"tests/unit/training/test_pretrain.py" = ["E402"]
